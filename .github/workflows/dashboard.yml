name: ONPE dashboard

# Actualiza docs/latest.json y lo publica. GitHub Pages (rama main, carpeta /docs)
# sirve el dashboard, que hace fetch de latest.json cada 30s.
#
# OJO: el cron de GitHub Actions corre como mínimo cada ~5 min y suele retrasarse.
# Para refresco real de 60s, corre update_data.py en tu máquina/VPS (ver DEPLOY.md).

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (best-effort)
  workflow_dispatch:        # botón manual en la pestaña Actions
  push:
    branches: [main]
    paths: ["docs/index.html", "update_data.py", ".github/workflows/dashboard.yml"]

permissions:
  contents: write

concurrency:
  group: onpe-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scrape ONPE -> docs/latest.json (con reintentos)
        run: |
          for i in 1 2 3; do
            python update_data.py && break
            echo "intento $i falló; reintento en 10s..."; sleep 10
          done
      - name: Commit si cambió
        run: |
          git config user.name  "onpe-bot"
          git config user.email "onpe-bot@users.noreply.github.com"
          git add docs/latest.json
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "data: actualiza latest.json [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          fi
